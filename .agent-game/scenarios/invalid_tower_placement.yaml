schema_version: "2.0.0"
scenario:
  id: "invalid_tower_placement"
  name: "ManaNet Invalid Placement Out of Bounds Fixture"
  seed: 1337
  viewport:
    width: 900
    height: 600

telemetry_mode: "full"
screenshot_mode: "none"
render_mode: "headless"

steps:
  - op: "launch"
    entrypoint: "res://simulation/core/GameState.gd"
  - op: "domain_action"
    action: "place_tower"
    params:
      tower_type: "archer"
      pos: [10, 10]  # Out of bounds (<25px margin)
  - op: "checkpoint"
    name: "after_invalid"
  - op: "assert"
    target: "telemetry.state_snapshot.player.gold"
    operator: "equals"
    value: 300
  - op: "assert"
    target: "telemetry.state_snapshot.towers_count"
    operator: "equals"
    value: 0
