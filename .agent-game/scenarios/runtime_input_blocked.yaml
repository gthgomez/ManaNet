schema_version: "2.0.0"
scenario:
  id: "runtime_input_blocked"
  name: "ManaNet Domain PASS vs Runtime Input Blocked"
  seed: 1337
  viewport:
    width: 900
    height: 600

telemetry_mode: "full"
screenshot_mode: "real"
render_mode: "windowed"

steps:
  - op: "launch"
    entrypoint: "res://scenes/GameScreen.tscn"
  - op: "wait"
    frames: 12
  - op: "checkpoint"
    name: "initial_runtime"
  - op: "domain_action"
    action: "place_tower"
    params:
      tower_type: "archer"
      pos: [350, 250]
  - op: "assert"
    target: "telemetry.state_snapshot.towers_count"
    operator: "equals"
    value: 1
  - op: "input_action"
    action: "set_placement_mode"
    params:
      mode: "drop"
  - op: "input_action"
    action: "clear_onboarding"
  - op: "input_action"
    action: "enter_placement"
    params:
      tower_type: "archer"
  - op: "input_action"
    action: "block_ui_input"
  - op: "wait"
    frames: 3
  - op: "pointer_touch"
    position: [200, 250]
  - op: "wait"
    frames: 6
  - op: "checkpoint"
    name: "after_blocked_touch"
  - op: "assert"
    target: "telemetry.state_snapshot.player.gold"
    operator: "equals"
    value: 220
  - op: "assert"
    target: "telemetry.state_snapshot.towers_count"
    operator: "equals"
    value: 1
