name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.6.2"
  GODOT_BIN: godot

jobs:
  test:
    name: Import & headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot
        # Pinned to the v2 tag commit for supply-chain stability.
        uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Cache Godot import data
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('assets/**', '**/*.tscn', '**/*.gd', 'project.godot') }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Import project headlessly
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee import.log

      - name: Fail on fatal import or parse errors
        run: |
          # The nested android/ project emits a known, benign warning, so gate
          # only on fatal errors rather than a blanket "ERROR" grep. Patterns
          # are anchored to Godot's error prefixes so benign prose that merely
          # mentions "Cannot load" cannot trip the gate.
          test -f import.log || { echo "::error::import.log was not produced."; exit 1; }
          if grep -E "^(SCRIPT ERROR|ERROR: .*(Parse Error|Failed to load script|Cannot open file|Cannot load))" import.log; then
            echo "::error::Godot reported fatal import/parse errors (see import.log)."
            exit 1
          fi

      - name: Simulation regression checks
        run: |
          set -o pipefail
          godot --headless --path . -s res://tests/simulation/regression_checks.gd 2>&1 | tee regression.log

      - name: Simulation speed parity (1x/2x/3x)
        run: |
          set -o pipefail
          godot --headless --path . -s res://tests/simulation/speed_parity.gd 2>&1 | tee speed_parity.log

      - name: Save fault injection
        run: |
          set -o pipefail
          godot --headless --path . -s res://tests/simulation/save_faults.gd 2>&1 | tee save_faults.log

      - name: Full-run qualification (all maps, all modifiers, all 15 waves)
        run: |
          set -o pipefail
          godot --headless --path . -s res://tests/simulation/full_run.gd 2>&1 | tee full_run.log

      - name: Clock authority
        run: |
          set -o pipefail
          godot --headless --path . -s res://tests/simulation/clock_authority.gd 2>&1 | tee clock.log

      - name: RNG isolation
        run: |
          set -o pipefail
          godot --headless --path . -s res://tests/simulation/rng_isolation.gd 2>&1 | tee rng.log

      - name: Victory qualification
        run: |
          set -o pipefail
          godot --headless --path . -s res://tests/simulation/victory_qualification.gd 2>&1 | tee victory.log

      - name: Early-run smoke test
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/SimTest.tscn 2>&1 | tee simtest.log

      - name: UI regression harness
        # Isolation: point the profile at a CI-scratch path so no job can read or
        # write a developer's real save even if a harness regressed.
        env:
          MANANET_PROFILE_PATH: ${{ runner.temp }}/ci-profile/td_progression.json
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$MANANET_PROFILE_PATH")"
          godot --headless --path . res://tests/ui/UIRegressionTest.tscn 2>&1 | tee uiregression.log

      - name: Player journey (real scenes, end to end)
        env:
          MANANET_PROFILE_PATH: ${{ runner.temp }}/ci-profile-journey/td_progression.json
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$MANANET_PROFILE_PATH")"
          godot --headless --path . res://tests/ui/PlayerJourneyTest.tscn 2>&1 | tee journey.log

      - name: Input-driven player journey
        env:
          MANANET_PROFILE_PATH: ${{ runner.temp }}/ci-profile-input/td_progression.json
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$MANANET_PROFILE_PATH")"
          godot --headless --path . res://tests/ui/InputJourneyTest.tscn 2>&1 | tee input_journey.log

      - name: Viewport geometry (desktop + mobile sizes)
        env:
          MANANET_PROFILE_PATH: ${{ runner.temp }}/ci-profile-geometry/td_progression.json
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$MANANET_PROFILE_PATH")"
          godot --headless --path . res://tests/ui/ViewportGeometryTest.tscn 2>&1 | tee geometry.log

      - name: Benchmark liveness and percentiles
        run: |
          set -o pipefail
          godot --headless --path . -s res://scripts/benchmark.gd 2>&1 | tee benchmark.log

      - name: Full audit (parse gate + exit-code contract)
        run: |
          set -o pipefail
          python3 tools/verify_game.py 2>&1 | tee verify.log

      - name: Verifier exit-status contract tests
        run: |
          set -o pipefail
          python3 tests/verifier_exit/test_verifier_exit.py 2>&1 | tee verifier_exit.log

      - name: Fail on runtime script errors or leaked resources
        run: |
          # Deliberate classification: SCRIPT ERROR is always fatal. Resource
          # leaks at exit are fatal for the harnesses that own their state, which
          # is what caught the undisposed SimTest GameState.
          LOGS="regression.log speed_parity.log save_faults.log full_run.log clock.log rng.log victory.log simtest.log uiregression.log journey.log input_journey.log geometry.log benchmark.log verify.log"
          if grep -n "SCRIPT ERROR" $LOGS 2>/dev/null; then
            echo "::error::A headless run reported SCRIPT ERROR; see logs."
            exit 1
          fi
          if grep -n "ObjectDB instances leaked at exit\|resources still in use at exit" $LOGS 2>/dev/null; then
            echo "::error::A harness leaked objects/resources at exit; see logs."
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: "*.log"
          if-no-files-found: ignore
